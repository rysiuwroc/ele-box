name: 🐛 Bug report
description: Something with Ele-Box isn't working right
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What's wrong?
      description: Describe the problem and what you expected to happen instead.
      placeholder: |
        e.g. With press-fit ribs on four sides the lid won't seat — it stops ~2 mm proud.
        I expected it to push flush like the snap-lock lid does.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Your settings (optional)
      description: Box size and the features you had switched on, so I can recreate it.
      placeholder: |
        Inside 120 x 80 x 35 mm, 3 mm walls.
        Lid: Press fit, ribs on four sides. Everything else default.
    validations:
      required: false
  - type: dropdown
    id: part
    attributes:
      label: Which part? (optional)
      description: Roughly where the problem is — helps me jump straight to it.
      options:
        - Not sure
        - Base
        - Lid
        - Gasket
        - Backplate
        - The fit between parts
    validations:
      required: false
